park:
  target:
    entity:
      integration: greenworks
      domain: lawn_mower
  fields:
    hours:
      required: false
      selector:
        number:
          min: 1
          max: 24
          step: 1
          mode: box
          unit_of_measurement: h

mow_continuously:
  target:
    entity:
      integration: greenworks
      domain: lawn_mower
  fields:
    days:
      required: true
      default: 2
      selector:
        number:
          min: 0
          max: 24
          step: 1
          mode: box
          unit_of_measurement: d

set_schedule:
  target:
    entity:
      integration: greenworks
      domain: lawn_mower
  fields:
    weekdays:
      required: true
      selector:
        select:
          multiple: true
          translation_key: weekdays
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    start_1:
      required: false
      selector:
        time:
    end_1:
      required: false
      selector:
        time:
    start_2:
      required: false
      selector:
        time:
    end_2:
      required: false
      selector:
        time:
